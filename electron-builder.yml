appId: com.supermarkdown.app
productName: SuperMarkdown
copyright: Copyright © 2026 SuperMarkdown Contributors
directories:
  buildResources: build
  output: release
# 使用本机已解压的 Electron，避免 Windows Defender 对新解压目录 rename 的锁定问题
electronDist: node_modules/electron/dist
files:
  - out/**/*
  - dist/**/*
  - package.json
asar: true
compression: normal
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
# MSIX 打包：electron-builder 26 已移除 msix target，
# 改用 scripts/build-msix.mjs（electron-windows-store），需 Windows SDK
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.productivity
  darkModeSupport: true
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Office
  maintainer: supermarkdown@example.com
publish: null
