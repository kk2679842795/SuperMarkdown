appId: com.supermarkdown.app
productName: SuperMarkdown
copyright: Copyright © 2026 SuperMarkdown Contributors
directories:
  buildResources: build
  output: release
# 使用本机已解压的 Electron，避免 Windows Defender 对新解压目录 rename 的锁定问题
electronDist: node_modules/electron/dist
files:
  - out/**/*
  - dist/**/*
  - package.json
asar: true
compression: normal
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
# 文件关联：.md/.markdown 可在"打开方式"中选择本程序并设为默认
fileAssociations:
  - ext: md
    name: Markdown 文档
    description: Markdown 文档
    role: Editor
  - ext: markdown
    name: Markdown 文档
    description: Markdown 文档
    role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  # 自定义 NSIS 脚本：向系统右键菜单添加"用 SuperMarkdown 打开"
  include: build/installer.nsh
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.productivity
  darkModeSupport: true
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Office
  maintainer: supermarkdown@example.com
publish: null
