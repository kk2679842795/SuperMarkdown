<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5FF0"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.82" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottomShade" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.4"/>
    </filter>
    <clipPath id="clip">
      <rect x="64" y="64" width="896" height="896" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- 主体圆角方块 -->
    <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
    <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#glow)"/>
    <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bottomShade)"/>

    <!-- 玻璃高光（左上） -->
    <ellipse cx="296" cy="196" rx="430" ry="300" fill="#FFFFFF" opacity="0.16"/>
    <ellipse cx="246" cy="140" rx="180" ry="120" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="800" cy="188" r="72" fill="#FFFFFF" opacity="0.12"/>

    <!-- 白色 M 字母（圆角粗描边） -->
    <path d="M 322 700 L 322 336 L 512 540 L 702 336 L 702 700"
          fill="none" stroke="#FFFFFF" stroke-width="124" stroke-linecap="round" stroke-linejoin="round" filter="url(#mShadow)"/>

    <!-- 右下 Markdown 徽标：深色圆角块 + 下箭头 -->
    <g filter="url(#badgeShadow)">
      <rect x="632" y="632" width="256" height="256" rx="66" fill="#0B1220"/>
      <path d="M 700 774 L 820 774" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
      <path d="M 700 774 L 760 824 L 820 774" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 细描边（画在裁剪层外，贴合边缘） -->
  <rect x="72" y="72" width="880" height="880" rx="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="5"/>
</svg>